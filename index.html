<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Олександр Різанович — День народження</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f4f1ea;
    --cream-deep: #ece6d9;
    --ink: #1c1a17;
    --ink-soft: #47423c;
    --line: rgba(28,26,23,0.18);
    --muted: #6b6560;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }

  body{
    background: var(--cream);
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 14px;
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
  }

  .card{
    width: 100%;
    max-width: 460px;
    background: var(--cream);
    border: 1px solid var(--line);
    padding: 48px 36px 44px;
  }

  .content{ text-align: center; }

  /* ---------- headline ---------- */
  .eyebrow{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 19px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .name{
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: 1px;
    line-height: 1.3;
    margin: 10px 0 8px;
  }

  .age-wrap{ margin: 4px 0 8px; }
  .age{
    font-family: 'Playfair Display', serif;
    font-weight: 500;
    font-size: 148px;
    line-height: 1;
    letter-spacing: -2px;
  }
  .age-label{
    font-size: 15px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 16px;
  }

  /* ---------- details ---------- */
  .details{
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
    text-align: left;
    display: grid;
    gap: 22px;
  }

  .row{ display:flex; gap: 18px; align-items: baseline; }
  .row .label{
    flex: 0 0 100px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .row .value{
    font-size: 20px;
    color: var(--ink);
    line-height: 1.4;
  }
  .row .value .sub{
    display:block;
    font-size: 14.5px;
    font-style: italic;
    color: var(--muted);
    margin-top: 2px;
  }

  /* ---------- location / gallery ---------- */
  .location{
    margin-top: 40px;
    padding-top: 32px;
    border-top: 1px solid var(--line);
    text-align: left;
  }
  .location .label{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .location .title{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .location .desc{
    font-size: 17px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .gallery{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .gallery img{
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    border: 1px solid var(--line);
    filter: grayscale(15%);
  }

  .closing{
    margin-top: 36px;
    padding-top: 26px;
    border-top: 1px solid var(--line);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 19px;
    color: var(--muted);
    letter-spacing: .3px;
    line-height: 1.5;
  }

  @media (max-width: 380px){
    .age{ font-size: 116px; }
    .name{ font-size: 25px; }
    .card{ padding: 40px 24px 36px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="content">
      <div class="eyebrow">День народження</div>
      <div class="name">Олександр<br>Різанович</div>

      <div class="age-wrap">
        <div class="age">43</div>
        <div class="age-label">роки</div>
      </div>

      <div class="details">
        <div class="row">
          <div class="label">Коли</div>
          <div class="value">25 вересня</div>
        </div>
        <div class="row">
          <div class="label">Де</div>
          <div class="value">Ресторан Grand Terrace<span class="sub">Apartel Skhidnytsya Wellness Resort</span></div>
        </div>
        <div class="row">
          <div class="label">Дрес-код</div>
          <div class="value">Вільний</div>
        </div>
      </div>

      <div class="location">
        <div class="label">Локація</div>
        <div class="title">Grand Terrace</div>
        <div class="desc">Ресторан на території Apartel Skhidnytsya Wellness Resort</div>
        <div class="gallery">
          <img src="interior.jpg" alt="Grand Terrace, інтер'єр">
          <img src="eat.jpg" alt="Сервірування столу Grand Terrace">
        </div>
      </div>

      <div class="closing">Буду радий відсвяткувати цей день разом із вами</div>
    </div>
  </div>

</body>
</html>
